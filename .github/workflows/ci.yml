name: CI

on:
  pull_request:
  push:
    branches: [ main ]
    paths-ignore:
      - "log/**"
      - "tmp/**"
      - ".dockerignore"
      - ".gitattributes"
      - ".gitignore"
      - "README.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation-checks:
    name: Validate
    uses: ./.github/workflows/validate-code.yml
