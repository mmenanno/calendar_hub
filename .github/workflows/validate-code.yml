name: Code Validation Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  code-quality:
    name: Quality (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [brakeman, importmap, rubocop, erb_lint]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run Brakeman
        if: matrix.check == 'brakeman'
        run: bin/brakeman --no-pager

      - name: Run Importmap Audit
        if: matrix.check == 'importmap'
        run: bin/importmap audit

      - name: Run Rubocop
        if: matrix.check == 'rubocop'
        run: bin/rubocop -f github

      - name: Run ERB Lint
        if: matrix.check == 'erb_lint'
        run: bin/erb_lint --lint-all

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libjemalloc2 sqlite3

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Setup test database
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare

      - name: Run tests
        env:
          RAILS_ENV: test
        run: bin/rails test
