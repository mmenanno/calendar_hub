# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # Rails installs this as a GVL-releasing busy handler (busy_handler_timeout),
  # so other Ruby threads keep running while a connection waits for a lock.
  # Do NOT also set `pragmas: busy_timeout` -- that replaces the handler with
  # SQLite's blocking one, which holds the GVL and freezes the whole process.
  timeout: 10000
  # Rails 8.1 already applies foreign_keys, journal_mode=wal, synchronous=normal,
  # mmap_size=128MB and journal_size_limit=64MB by default
  # (ActiveRecord::ConnectionAdapters::SQLite3Adapter::DEFAULT_PRAGMAS).
  pragmas:
    # Default is 2000 pages (~8MB); a 64MB page cache keeps the events table and
    # its indexes in memory. Negative value = KiB.
    cache_size: -64000

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  cable:
    <<: *default
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3


# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
