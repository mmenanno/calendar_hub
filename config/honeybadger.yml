---
# For more options, see https://docs.honeybadger.io/lib/ruby/gem-reference/configuration
# The API key is read from the HONEYBADGER_API_KEY environment variable.

# The environment your app is running in.
env: "<%= Rails.env %>"

# The absolute path to your project folder.
root: "<%= Rails.root.to_s %>"

# Honeybadger won't report errors in these environments.
development_environments:
- test
- development
- cucumber

# By default, Honeybadger won't report errors in the development_environments.
# You can override this by explicitly setting report_data to true.
# report_data: true

# The current Git revision of your project. Defaults to the last commit hash.
# revision: null

# Enable verbose debug logging (useful for troubleshooting).
debug: false

# Honeybadger Insights. Only enabled when an API key is configured, otherwise
# the agent keeps trying (and failing) to ship events.
insights:
  enabled: <%= ENV["HONEYBADGER_API_KEY"].present? %>

# A single sync issues one outbound HTTP request and many SQL queries per
# event, which would flood Insights. Don't record an event per Net::HTTP
# request; SQL events are sampled in config/initializers/honeybadger.rb.
net_http:
  insights:
    events: false
