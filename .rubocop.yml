inherit_gem:
  rubocop-mmenanno: config/rails.yml

plugins:
  - rubocop-mmenanno
  - rubocop-rails
  - rubocop-performance
  - rubocop-minitest
  - rubocop-thread_safety

# Merge Include with RuboCop's defaults instead of replacing them, so the
# whole app is linted and not just .toys.
inherit_mode:
  merge:
    - Include

AllCops:
  Exclude:
    - bin/bundle
    - db/schema.rb
    - db/*_schema.rb
  Include:
    - '.toys/**/*.rb'
  NewCops: enable

Rails:
  Enabled: true

Rails/SkipsModelValidations:
  Exclude:
    - db/migrate/**/*
    - test/**/*

Rails/UnknownEnv:
  Environments:
    - production
    - development
    - test

Rails/RefuteMethods:
  EnforcedStyle: refute

Rails/Output:
  Exclude:
    - db/seeds.rb

Rails/I18nLocaleTexts:
  Exclude:
    - test/views/**/*

Performance:
  Enabled: true

Minitest:
  Enabled: true

Minitest/MultipleAssertions:
  Max: 7
  Exclude:
    - test/views/**/*

ThreadSafety:
  Enabled: true

ThreadSafety/NewThread:
  Exclude:
    - test/**/*

# Long by nature (crypto helpers, helper bag, ICS fixtures); splitting them
# would not make them clearer.
Metrics/ModuleLength:
  Exclude:
    - app/helpers/application_helper.rb
    - app/services/calendar_hub/credential_encryption.rb
    - test/support/**/*

Naming/PredicateMethod:
  AllowedMethods:
    - notify
